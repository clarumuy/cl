name: control-laboratorios
services:
  db:
    image: mariadb:11.8
    environment:
      TZ: UTC
      MARIADB_DATABASE: control
      MARIADB_USER: control
      MARIADB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD}
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      TZ: UTC
      DB_URL: jdbc:mariadb://db:3306/control
      DB_USER: control
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD}
      PUBLIC_SERVER_URL: https://${SERVER_HOST:?Falta SERVER_HOST}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    environment:
      SERVER_HOST: ${SERVER_HOST}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  db_data:
  caddy_data:
  caddy_config:
